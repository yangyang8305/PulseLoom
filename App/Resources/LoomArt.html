  function rgba(h, a) { const n = hex(h); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }

    light: { bg: '#fcf7f3', surface: '#fffcf9', ink: '#423238', muted: '#806d75', line: '#dfced3', accent: '#966879', hero1: '#f7e8e7', hero2: '#e7c6d1', hero3: '#c7a2b9' },
