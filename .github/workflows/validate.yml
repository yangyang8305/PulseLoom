name: Source and Apple SDK validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/PulseLoomCore
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture immutable P2 review input
        run: git archive --format=tar HEAD > /tmp/p2-review-input.tar
      - uses: actions/upload-artifact@v4
        with:
          name: p2-review-source-${{ github.sha }}
          path: /tmp/p2-review-input.tar
          retention-days: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r Server/requirements-dev.txt
      - run: python -m pytest Server/tests -q
      - name: Verify checked-in project and manifest
        run: python Scripts/check-generated-project.py
      - run: python Scripts/validate-source.py --no-swift-parse
  apple-sdk:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify checked-in project and manifest
        run: python Scripts/check-generated-project.py
      - name: Report selected SDKs
        run: xcodebuild -version && xcodebuild -showsdks
      - name: Build iPhone, Watch, and embedded Widget
        run: bash Scripts/build-ios.sh
      - name: Native service regression tests
        run: bash Scripts/test-services.sh
      - name: Native UI tests
        if: ${{ !cancelled() }}
        run: bash Scripts/test-ui.sh
      - name: Validate App Intents metadata and concurrency diagnostics
        if: ${{ !cancelled() }}
        run: python Scripts/check-apple-diagnostics.py
      - name: Package and launch exact simulator ZIP
        run: bash Scripts/package-simulator-preview.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-preview-${{ github.sha }}
          path: Artifacts/Preview/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-sdk-validation
          path: |
            Artifacts/*.log
            Artifacts/Preview/preview-smoke.log
            Artifacts/*.xcresult
          if-no-files-found: ignore
