name: Source and Apple SDK validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/PulseLoomCore
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r Server/requirements-dev.txt
      - run: python -m pytest Server/tests -q
      - run: python Scripts/validate-source.py --no-swift-parse
  apple-sdk:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Report selected SDKs
        run: xcodebuild -version && xcodebuild -showsdks
      - name: Build iPhone, Watch, and embedded Widget
        run: bash Scripts/build-ios.sh
      - name: Native UI tests
        run: bash Scripts/test-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-sdk-validation
          path: |
            Artifacts/*.log
            Artifacts/*.xcresult
          if-no-files-found: ignore
