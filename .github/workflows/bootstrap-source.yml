name: Bootstrap full PulseLoom source
on:
  push:
    paths:
      - '.bootstrap-upload/READY'
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap-upload/chunk-*.b64 > /tmp/pulseloom.b64
          base64 -d /tmp/pulseloom.b64 > /tmp/pulseloom.tar.gz
          mkdir -p /tmp/pulseloom-src
          tar -xzf /tmp/pulseloom.tar.gz -C /tmp/pulseloom-src
          expected="$(cat .bootstrap-upload/SHA256)"
          actual="$(sha256sum /tmp/pulseloom.tar.gz | awk '{print $1}')"
          test "$expected" = "$actual"
      - name: Replace bootstrap tree with source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/pulseloom-src/. .
          git config user.name "PulseLoom Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Import complete PulseLoom native source"
          git push origin HEAD:main
